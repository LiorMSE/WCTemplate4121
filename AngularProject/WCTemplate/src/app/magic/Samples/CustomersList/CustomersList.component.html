<div novalidate [formGroup]="screenFormGroup">
  <div [magic]="mgc.CustomersList">

    <div class="table-container">
      <div class="detail-header">
        <div class="detail-header-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <div class="detail-header-text">
          <div class="page-title" style="margin-bottom: 0;">ניהול לקוחות</div>
          <div class="detail-header-subtitle">צפייה, חיפוש ועריכת פרטי לקוחות</div>
        </div>
      </div>
      <div class="d-flex flex-wrap pb-3 align-items-center justify-content-between gap-2">
        <!-- פילטרים בצד ימין -->
        <div class="d-flex flex-wrap align-items-center gap-2">
          <div style="min-width: 200px; max-width: 280px; flex: 1;">
            <div class="searchbox-container">
              <i class="fa fa-search"></i>
              <input matInput type='text' matInput [magic]="mgc.vSearch" [formControlName]="mgc.vSearch" mgFormat
                placeholder="חפש..." class="w-100" [pollTime]="400">
            </div>
          </div>

          <div style="min-width: 140px; max-width: 180px;">
            <!-- no-parent class is used for elements without a parent element to inherit background color from -->
            <mat-form-field appearance="outline" class="w-100 no-parent">
              <mat-label>פעיל</mat-label>
              <mat-select [magic]="mgc.vActiveFilter" [formControlName]="mgc.vActiveFilter">
                <mat-option *ngFor="let o of mg.getItemListValues(mgc.vActiveFilter);" [value]="o.index">
                  {{o.displayValue}}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>

          <!-- MutliSelect Example -->
          <!-- <div style="min-width: 140px; max-width: 180px;">
            <mat-form-field appearance="outline" class="w-100 no-parent">
              <mat-label>בחירה מרובה</mat-label>
              <mat-select [magic]="mgc.vMultiSelectCombo" [formControlName]="mgc.vMultiSelectCombo" multiple>
                <mat-option *ngFor="let o of mg.getItemListValues(mgc.vMultiSelectCombo);" [value]="o.index">
                  {{o.displayValue}}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div> -->
        </div>

        <!-- כפתור הוספה בצד שמאל -->
        <div class="desktop-add-btn">
          <button class="table-header-button" [magic]="mgc.bAdd">
            <i class="fa-solid fa-circle-plus"></i>
            <label class="header-button-label">הוספה</label>
          </button>
        </div>
      </div>
      <div class="row">
        <magic-subform [magic]="mgc.sTable" class="col-12">
        </magic-subform>
      </div>
    </div>
  </div>

  <!-- Mobile FAB -->
  <button class="fab-add" [magic]="mgc.bAdd">
    <i class="fa-solid fa-plus"></i>
  </button>
</div>
